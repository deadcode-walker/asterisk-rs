[workspace]
resolver = "3"
members = ["crates/*", "tests"]

[workspace.package]
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/deadcode-walker/asterisk-rs"
homepage = "https://github.com/deadcode-walker/asterisk-rs"
keywords = ["asterisk", "voip", "telephony", "pbx", "sip"]
categories = ["network-programming", "api-bindings"]

[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
exit = "deny"
large_futures = "deny"
large_stack_arrays = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
enum_glob_use = "deny"

[workspace.lints.rust]
unreachable_pub = "deny"
unsafe_code = "forbid"

[workspace.dependencies]
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
# reqwest 0.13's rustls feature intentionally selects AWS-LC and the platform verifier
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Expose tokio-tungstenite's Rustls connector; ARI supplies an explicit AWS-LC/platform-verifier config
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = { version = "0.7", default-features = false }
tokio-rustls = "0.26"
aws-lc-rs = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
bytes = "1"
md-5 = "0.11"
url = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

zeroize = "1"
