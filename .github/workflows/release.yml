name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact green main commit to publish
        required: true
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact main commit that passed the calling CI gate
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
      RELEASE_PLZ_TOKEN:
        required: true

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write # exchange GitHub OIDC for a short-lived crates.io token
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Verify the reviewed candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git checkout -B main "$CANDIDATE_SHA"
          git branch --set-upstream-to=origin/main main
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Authenticate to crates.io with OIDC
        if: github.event_name == 'workflow_dispatch'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish verified releases
        if: github.event_name == 'workflow_call'
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Publish coordinated manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail

          published() {
            curl --fail --silent --show-error \
              --user-agent 'asterisk-rs release workflow' \
              "https://crates.io/api/v1/crates/$1/0.8.0" \
              | jq -e '.version.num == "0.8.0"' >/dev/null
          }

          publish() {
            local package="$1"
            if ! published "$package"; then
              cargo publish --locked -p "$package"
            fi
            for _ in {1..60}; do
              if published "$package"; then
                return
              fi
              sleep 5
            done
            echo "crates.io did not expose $package 0.8.0 within five minutes" >&2
            return 1
          }

          publish asterisk-rs-core
          publish asterisk-rs-ami
          publish asterisk-rs-agi
          publish asterisk-rs-ari
          publish asterisk-rs

          if ! gh release view v0.8.0 >/dev/null 2>&1; then
            gh release create v0.8.0 \
              --target "$CANDIDATE_SHA" \
              --title asterisk-rs-v0.8.0 \
              --generate-notes
          fi

  release-pr:
    name: Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'workflow_call'
    permissions:
      contents: read
    concurrency:
      group: release-pr-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Verify the reviewed candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git checkout -B main "$CANDIDATE_SHA"
          git branch --set-upstream-to=origin/main main
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Create or update the release PR
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
