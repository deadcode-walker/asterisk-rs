name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact green main commit to publish
        required: true
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact main commit that passed the calling CI gate
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
      RELEASE_PLZ_TOKEN:
        required: true

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write # exchange GitHub OIDC for a short-lived crates.io token
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Verify the reviewed candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Publish verified releases
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-pr:
    name: Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'workflow_call'
    permissions:
      contents: read
    concurrency:
      group: release-pr-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Verify the reviewed candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Create or update the release PR
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
