name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just,cargo-deny,cargo-shear,typos-cli,mdbook,zizmor
          fallback: none
      - name: Install actionlint 1.7.12
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' }}
          shared-key: quality-1.97.1
      - run: just ci
      - name: Reject generated or formatting drift
        run: git diff --exit-code

  platform:
    name: Platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' }}
          shared-key: platform-${{ matrix.os }}-1.97.1
      - run: just platform

  msrv:
    name: MSRV 1.86.0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact MSRV
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          rustup default 1.86.0
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' }}
          shared-key: msrv-1.86.0
      - run: just msrv

  semver:
    name: Semver
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just,cargo-semver-checks
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' }}
          shared-key: semver-1.97.1
      - run: just semver

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
          rustup default 1.97.1
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' }}
          shared-key: coverage-1.97.1
      - run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

  live:
    name: Live Asterisk ${{ matrix.asterisk }} (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        # Asterisk 22 is the repository's only declared live-support branch.
        asterisk: ["22"]
        suite: [smoke, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' }}
          shared-key: live-1.97.1
      - name: Run selected live suite
        env:
          LIVE_SUITE: ${{ matrix.suite }}
        run: just "live-${LIVE_SUITE}-ci"

  gate:
    name: CI
    if: always()
    needs: [quality, platform, msrv, semver, coverage, live]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          PLATFORM: ${{ needs.platform.result }}
          MSRV: ${{ needs.msrv.result }}
          SEMVER: ${{ needs.semver.result }}
          COVERAGE: ${{ needs.coverage.result }}
          LIVE: ${{ needs.live.result }}
        run: |
          for result in "$QUALITY" "$PLATFORM" "$MSRV" "$SEMVER" "$COVERAGE" "$LIVE"; do
            test "$result" = success
          done

  docs:
    name: Documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gate
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write # deploy the generated documentation site
      id-token: write # authenticate the deployment to GitHub Pages

  release:
    name: Release Automation
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASE_AUTOMATION_ENABLED == 'true'
    needs: gate
    uses: ./.github/workflows/release.yml
    with:
      candidate_sha: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write # exchange GitHub OIDC for a short-lived crates.io token
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
