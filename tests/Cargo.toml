[package]
name = "asterisk-rs-tests"
version = "0.0.0"
publish = false
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-tungstenite.workspace = true
serde_json.workspace = true

[dev-dependencies]
asterisk-rs-ami = { path = "../crates/asterisk-rs-ami" }
asterisk-rs-agi = { path = "../crates/asterisk-rs-agi" }
asterisk-rs-ari = { path = "../crates/asterisk-rs-ari" }
asterisk-rs-core = { path = "../crates/asterisk-rs-core" }
asterisk-rs = { path = "../crates/asterisk-rs", features = ["ami"] }
tokio-util = { workspace = true, features = ["codec"] }
bytes.workspace = true
url.workspace = true
zeroize.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
aws-lc-rs.workspace = true

[features]
integration = []

[[test]]
name = "live_integration"
path = "tests/live_integration.rs"
required-features = ["integration"]
