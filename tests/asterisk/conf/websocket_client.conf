[media_plain]
type = websocket_client
uri = ws://host.docker.internal:8787/media
protocols = media
connection_type = per_call_config
connection_timeout = 1000
reconnect_interval = 250
reconnect_attempts = 3
tls_enabled = no

[media_json]
type = websocket_client
uri = ws://host.docker.internal:8788/media
protocols = media
connection_type = per_call_config
connection_timeout = 1000
reconnect_interval = 250
reconnect_attempts = 3
tls_enabled = no
